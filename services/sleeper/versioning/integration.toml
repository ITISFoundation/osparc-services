[tool.bumpversion]
current_version = "1.0.0"
commit = false
tag = false
message = "integration version: {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "VERSION_INTEGRATION"

[[tool.bumpversion.files]]
filename = "metadata/metadata.yml"
search = "integration-version: {current_version}"
replace = "integration-version: {new_version}"
