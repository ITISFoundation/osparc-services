services:
  sleeper:
    image: local/${DOCKER_IMAGE_NAME}:${DOCKER_BUILD_TARGET}
    build:
      context: ./
      dockerfile: docker/custom/Dockerfile
      target: production
      args:
        BASE_IMAGE: python:${PYTHON_VERSION}-slim
        PYTHON_VERSION: ${PYTHON_VERSION}

  sleeper-gpu:
    image: local/${DOCKER_IMAGE_NAME}-gpu:${DOCKER_BUILD_TARGET}
    build:
      context: ./
      dockerfile: docker/custom/Dockerfile
      target: production
      args:
        # nvidia-smi/CUDA driver libs are injected by the NVIDIA Container Toolkit at
        # runtime regardless of base image; no CUDA image needed since we never link
        # against cudart/cuBLAS etc, so reuse the same slim image as sleeper.
        BASE_IMAGE: python:${PYTHON_VERSION}-slim
        PYTHON_VERSION: ${PYTHON_VERSION}
  sleeper-mpi:
    image: local/${DOCKER_IMAGE_NAME}-mpi:${DOCKER_BUILD_TARGET}
    build:
      context: ./
      dockerfile: docker/custom/Dockerfile
      target: production
      args:
        BASE_IMAGE: python:${PYTHON_VERSION}-slim
        PYTHON_VERSION: ${PYTHON_VERSION}
