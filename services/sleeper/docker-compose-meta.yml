        org.opencontainers.image.revision: ${VCS_REF}
        org.opencontainers.image.source: ${VCS_URL}
        org.opencontainers.image.title: sleeper-gpu
        simcore.service.settings: '[{ "name": "constraints", "type": "string", "value":
