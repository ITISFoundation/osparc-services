name: Github-CI Push/PR sleeper

on:
  push:
    paths:
      - "services/sleeper/**"
      - "!**.md"
  pull_request:
    paths:
      - "services/sleeper/**"
      - "!**.md"

env:
  # secrets can be set in settings/secrets on github
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  build:
    name: building sleeper
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python: [3.14]
        os: [ubuntu-24.04]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
          cache-dependency-path: "**/requirements.txt"
      - name: install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: show versions
        run: ./ci/helpers/show_system_versions.bash
      - name: set owner variable
        run: echo "OWNER=${GITHUB_REPOSITORY%/*}" >> $GITHUB_ENV
      - name: set docker image tag
        if: github.ref != 'refs/heads/master'
        run: echo "DOCKER_IMAGE_TAG=${GITHUB_REF##*/}" >> $GITHUB_ENV
      - name: set dev environs
        working-directory: "services/sleeper"
        run: make devenv
      - name: get current image if available
        working-directory: "services/sleeper"
        run: make pull-latest || true
      - name: build
        working-directory: "services/sleeper"
        run: |
          make build
          make info-build
      - name: test
        working-directory: "services/sleeper"
        run: make tests
      - name: set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          image: tonistiigi/binfmt:latest
          platforms: all
      - name: setup docker buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: ${{ matrix.docker_buildx }}
          driver: docker-container # a must for multi-arch buildsplatform
      - if: github.event_name == 'push'
        name: dockerhub login
        working-directory: "services/sleeper"
        run: ./../../ci/helpers/dockerhub_login.bash
      - name: build and deploy image for multi-arch
        if: github.event_name == 'push'
        working-directory: "services/sleeper"
        env:
          DOCKER_TARGET_PLATFORMS: linux/amd64,linux/arm64
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
        run: |
          make build push=1
      - name: build image for multi-arch
        if: github.event_name == 'pull_request'
        working-directory: "services/sleeper"
        env:
          DOCKER_TARGET_PLATFORMS: linux/amd64,linux/arm64
        run: |
          make build
